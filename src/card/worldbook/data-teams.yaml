# ═══════════════ [F1M数据] 车队 ═══════════════
# 2026 赛季真实的 11 支车队（季前状态）。
#
# 数值依据（2026-10 整理）：
#   - 2025 赛季成绩：车队积分榜 迈凯伦 833 / 梅赛德斯 469 / 红牛 451 / 法拉利 398 / 威廉姆斯 137 /
#     小红牛 92 / 阿斯顿·马丁 89 / 哈斯 79 / 索伯 70 / 阿尔派 22。
#   - 2026 赛季实测：各车队相对梅赛德斯的平均单圈差距（秒），赛车数值按这张表校准：
#       梅赛德斯 基准 / 法拉利 +0.422 / 迈凯伦 +0.502 / 红牛 +0.676 / 阿尔派 +1.657 /
#       奥迪 +1.866 / 小红牛 +1.877 / 哈斯 +2.242 / 威廉姆斯 +2.454 / 凯迪拉克 +3.676 /
#       阿斯顿·马丁 +3.783
#     校准方法：在均衡赛道上（权重与赛车综合分相同），两台车的「赛车综合分 × 0.08 秒 +
#     车手正赛能力 × 0.035 秒」平均值与梅赛德斯的差，等于上表的差距（误差 < 0.02 秒）。
#     所以车手较强的车队，赛车数值会相应低一些。
#   - 动力单元：梅赛德斯（梅赛德斯 / 迈凯伦 / 威廉姆斯 / 阿尔派）、红牛-福特（红牛 / 小红牛）、
#     法拉利（法拉利 / 哈斯 / 凯迪拉克）、本田（阿斯顿·马丁）、奥迪（奥迪）。
#     同一供应商的客户车队拿到同一规格的动力单元，所以 六类动力单元部件数值相同。
#   - 动力单元排序：梅赛德斯 > 法拉利 > 红牛-福特 > 奥迪 > 本田（本田可靠性最差）。
#     本卡设定中法拉利放弃了钢制气缸盖方案，退回成熟方案：功率接近梅赛德斯，可靠性略逊。
#
# 数值尺度：零件性能 perf 每差 1 点，赛车综合分约差 1 点；在一般赛道上约等于每圈 0.08 秒
#           （规则中的 secPerCarPoint）。最快与最慢的车相差约 3.8 秒，所以综合分跨度约 45 点。可靠性 rel 85 约每场 4% 故障率，70 约 10%。
#
# 字段说明（除 id 外都可省略，省略时使用默认值）：
#   id              唯一标识（英文/数字），车手与赛历都用它引用车队
#   name / short    全称 / 三字母简称
#   color           车队主色（#RRGGBB），用于界面
#   principal       AI 车队的领队名字（玩家车队会被替换成玩家）
#   special         特殊机制（可省略）。目前只有 ferrari：玩家作为过渡领队，
#                   需要维持媒体支持率并平衡两位车手的粉丝意见，否则会被撤职
#   engine / base   动力单元供应商 / 车队基地
#   worksTeam       动力单元厂商车队（true / 省略）。同一 engine 的其他车队是客户车队：
#                   不能自行研发六类动力单元部件，厂商车队的新件会同时交付给客户车队。
#                   ADUO 评估也按厂商（engine）进行，只有厂商车队获得补偿
#   funds           初始资金（百万美元 M$）
#   sponsorIncome   每站赞助收入（M$）
#   operatingCost   每站运营成本（M$，计入预算帽）
#   targetPosition  董事会期望的车队排名
#   selectionDifficulty  开局选队难度分组：easy 简单 / medium 中等 / hard 困难（省略时为 medium）
#   facilities      设施等级 1~5：windTunnel 风洞 / cfd CFD / simulator 模拟器 / factory 工厂
#                   （模拟器等级影响周末初始调校信心）
#   staff           关键员工：technicalDirector 技术总监 / aeroChief 空气动力学主管 /
#                   raceEngineer 一号车比赛工程师 / raceEngineer2 二号车比赛工程师 /
#                   pitCrew 维修组 / strategist 首席策略师
#                   每项可写 {name, skill(1~100), salary(年薪 M$)}，也可只写一个数字表示 skill
#                   工程师可写 abilities: {setup, communication, reaction, weather}；
#                   首席策略师可写 abilities: {strategy, weather, reaction, risk}。旧数据缺失时回退到 skill。
#   carBase         未单独填写的零件默认 {perf 性能, rel 可靠性}
#   parts           各零件初始 {perf, rel}，键为零件类型：
#                   ice 内燃机 / turbocharger 涡轮 / mgu_k 动能回收电机 / energy_store 储能系统 /
#                   control_electronics 控制电子 / exhaust 排气（2026：MGU-K 350kW，取消 MGU-H）/
#                   gearbox 变速箱 / chassis 底盘 / front_wing 前翼（主动空力）/
#                   rear_wing 尾翼（主动空力）/ floor 底板 / sidepods 侧箱 / suspension 悬挂
#   description     车队简介（会显示在面板上）
