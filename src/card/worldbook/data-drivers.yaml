# ═══════════════ [F1M数据] 车手 ═══════════════
# 2026 赛季真实阵容：11 支车队 22 名正式车手；除奥迪（官方替补待确认）外均列入已知替补。
# 能力值依据 2025 赛季成绩与职业生涯表现估算（2025 车手榜前列：诺里斯 423、维斯塔潘 421、
# 皮亚斯特里 410、拉塞尔 319、勒克莱尔 242、汉密尔顿 156、安东内利 150）。
# 年龄按 2026 赛季开始时计算；年薪与合同到期年份是根据公开报道的估计值。
#
# 能力值对圈速的影响：正赛能力 = 速度×0.4 + 缠斗×0.25 + 稳定×0.2 + 轮胎×0.15（雨天雨战占一半），
#   排位能力 = 速度×0.75 + 稳定×0.25；每差 1 点约差 0.035 秒/圈（规则中的 secPerDriverPoint）。
#   稳定性还决定圈速波动和失误率；技术反馈影响练习赛调校效率与排位加成。
#
# 字段说明：
#   id            唯一标识（AI 的数值指令用它指代车手，建议简短）
#   name / short  姓名 / 三字母缩写
#   number        车号
#   nationality   国籍
#   age           年龄（影响成长：≤24 岁成长快，≥34 岁速度开始衰退）
#   team          所属车队 id（留空 = 自由车手）
#   role          race 正式车手 / reserve 替补（每队 1~3 名正式车手，决定赛车数量）
#   attrs         能力 1~100：
#                   pace 速度 / racecraft 缠斗 / consistency 稳定 /
#                   tyre 轮胎管理 / wet 雨战 / feedback 技术反馈（影响练习赛调校效率）
#   potential     潜力上限（综合能力到达后成长几乎停止）
#   morale        初始心态 0~100
#   ego           自尊心 0~100：越高越在意升级件分配、优先车手和车队指令
#   salary        年薪（M$）
#   contractEnd   合同到期年份
#   traits        性格标签（给 AI 叙事参考）
