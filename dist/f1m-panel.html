.car-svg .bp-dim{stroke:#7fdcff;stroke-opacity:.35;stroke-width:1;fill:none}
.car-svg .bp-dim-t{fill:#7fdcff;fill-opacity:.55;font-size:12px;letter-spacing:.08em}
.car-svg .centre{stroke:#7fdcff;stroke-opacity:.22;stroke-width:1;stroke-dasharray:10 4 2 4}
.car-svg .fixed .s{fill:#0b1016;stroke:#9aa6b8;stroke-opacity:.55;stroke-width:1.3}
.car-svg .fixed .d{fill:none;stroke:#9aa6b8;stroke-opacity:.35;stroke-width:1}
.car-svg .part{--pc:#7fdcff;cursor:pointer}
.car-svg .part .s{fill:color-mix(in srgb,var(--pc) 9%,transparent);stroke:var(--pc);stroke-width:1.6;stroke-linejoin:round;transition:fill .2s,stroke-width .2s}
.car-svg .part .d{fill:none;stroke:var(--pc);stroke-opacity:.75;stroke-width:1.1;stroke-linecap:round}
.car-svg .part .f{fill:var(--pc);fill-opacity:.85;stroke:none}
.car-svg .part:hover .s{fill:color-mix(in srgb,var(--pc) 22%,transparent)}
.car-svg .perf-top{--pc:#b05cff}.car-svg .perf-good{--pc:#1fd17a}.car-svg .perf-mid{--pc:#ffd60a}.car-svg .perf-low{--pc:#ff5a5f}
.car-svg .perf-locked{--pc:#4a5060;cursor:not-allowed}
.car-svg .perf-locked .s{fill:url(#hatch)}
.car-svg .is-rnd .s{stroke-dasharray:7 4;animation:car-march 1.1s linear infinite}
.car-svg .is-new .s{animation:car-pulse 1.6s ease-in-out infinite}
.car-svg .is-selected .s{stroke:#fff;stroke-width:2.6;fill:color-mix(in srgb,var(--pc) 28%,transparent);filter:drop-shadow(0 0 6px var(--pc))}
.car-svg .callout{--pc:#7fdcff;cursor:pointer}
.car-svg .callout .lead{fill:none;stroke:var(--pc);stroke-opacity:.6;stroke-width:1.2}
.car-svg .callout .dot{fill:var(--pc)}
.car-svg .callout .pill{fill:#0a0d13;stroke:var(--pc);stroke-opacity:.7;stroke-width:1.2}
.car-svg .callout .tag{fill:var(--pc)}
.car-svg .callout .nm{fill:#f3f4f7;font-size:20px;font-weight:700;font-style:italic}
.car-svg .callout .val{fill:var(--pc);font-size:17px;font-weight:700;font-family:'Bahnschrift','Roboto Condensed',ui-monospace,monospace}
.car-svg .callout.is-selected .pill{fill:color-mix(in srgb,var(--pc) 26%,#0a0d13);stroke:#fff;stroke-opacity:1;stroke-width:1.8}
.car-svg .callout.perf-locked .nm{fill:#8e95a5}
@keyframes car-march{to{stroke-dashoffset:-22}}
@keyframes car-pulse{50%{fill:color-mix(in srgb,var(--pc) 34%,transparent);filter:drop-shadow(0 0 8px var(--pc))}}
@media (prefers-reduced-motion:reduce){.car-svg .part .s{animation:none!important}}
